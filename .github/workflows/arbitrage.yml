name: Dulink Arbitrage

on:
  schedule:
    - cron: '0 23 * * *'  # 00:00 ora Romaniei (vara), 23:00 iarna
  workflow_dispatch:        # permite rulare manuala din GitHub

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instaleaza dependente
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Ruleaza botul
        run: python main.py run
        env:
          DULINK_EMAIL:    ${{ secrets.DULINK_EMAIL }}
          DULINK_PASSWORD: ${{ secrets.DULINK_PASSWORD }}
          DULINK_PLANT:    ${{ secrets.DULINK_PLANT }}
