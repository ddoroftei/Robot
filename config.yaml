# Strategia de arbitraj (complet automata)
arbitrage:
  # Eficienta round-trip a bateriei (ex: 0.90 = 90%)
  # Influenteaza pragul minim de profit: descarci doar daca merita dupa pierderi
  battery_efficiency: 0.90

  # Moneda preturilor OPCOM
  currency: "RON"   # RON sau EUR

# Setarile de executie
scheduler:
  # Ora la care ruleaza botul zilnic
  # OPCOM publica de obicei dupa ~12:00-13:00, dar poti seta mai devreme
  # si botul va reincerca daca preturile nu sunt inca disponibile
  run_time: "13:30"          # HH:MM - ora locala Bucuresti

  # Numarul de reincercari daca preturile nu sunt inca publicate
  retry_count: 5
  retry_wait_minutes: 15     # Asteapta 15 min intre reincercari

  # Executa si la pornire imediata (nu asteapta run_time)
  run_on_start: false

  timezone: "Europe/Bucharest"

# Browser automation
browser:
  headless: true             # false = vezi browser-ul (pentru debug/testare)
  slow_mo: 1000               # ms intre actiuni (mareste daca site-ul e lent)
  timeout: 30000             # Timeout pagina in ms
  screenshot_on_error: true  # Salveaza screenshot la eroare in logs/

# Logging
logging:
  level: "INFO"
  file: "logs/arbitrage.log"
  max_size_mb: 10
  backup_count: 5

